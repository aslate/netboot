        tasks:
          - {id: T5, status: queued, category: change, title: "Prepare and validate Fedora installer payload", parent: null, source: "User implementation plan", exit: "Checksum, nonempty kernel/initramfs, effective config, labels, and HTTP body checks distinguish missing payload from delivery/config failure.", notes: "Preserve Fedora 44 netinst recipe, KDE Kickstart, menu/default, and version."}
