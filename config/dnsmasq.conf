# Proxy-DHCP and TFTP bootstrap for the netboot server.
interface=eno1
bind-interfaces
port=0
dhcp-range=192.168.1.0,proxy
log-dhcp
dhcp-match=set:ipxe,175
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:!ipxe,tag:efi64,ipxe.efi,,192.168.1.2
pxe-service=tag:!ipxe,tag:efi64,7,"Netboot iPXE",ipxe.efi,192.168.1.2
dhcp-boot=tag:!ipxe,tag:bios,undionly.kpxe,,192.168.1.2
pxe-service=tag:!ipxe,tag:bios,0,"Netboot iPXE",undionly.kpxe,192.168.1.2
dhcp-boot=tag:ipxe,http://192.168.1.2/menu/main.ipxe,,0.0.0.1
enable-tftp
tftp-root=/srv/netboot/tftp
tftp-secure
