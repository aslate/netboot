# Proxy-DHCP and TFTP bootstrap for the netboot server.
interface=${NETBOOT_INTERFACE}
bind-interfaces
port=${NETBOOT_DNSMASQ_PORT}
dhcp-range=${NETBOOT_DHCP_PROXY_RANGE},proxy
log-dhcp
dhcp-match=set:ipxe,175
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:!ipxe,tag:efi64,${NETBOOT_UEFI_BOOTSTRAP},,${NETBOOT_SERVER_IP}
pxe-service=tag:!ipxe,tag:efi64,7,"Netboot iPXE",${NETBOOT_UEFI_BOOTSTRAP},${NETBOOT_SERVER_IP}
dhcp-boot=tag:!ipxe,tag:bios,${NETBOOT_BIOS_BOOTSTRAP},,${NETBOOT_SERVER_IP}
pxe-service=tag:!ipxe,tag:bios,0,"Netboot iPXE",${NETBOOT_BIOS_BOOTSTRAP},${NETBOOT_SERVER_IP}
dhcp-boot=tag:ipxe,${NETBOOT_IPXE_MENU_URL},,0.0.0.1
enable-tftp
tftp-root=${NETBOOT_TFTP_ROOT}
tftp-secure
