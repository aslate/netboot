set pager=1
set timeout=10
set default=0

insmod part_gpt
insmod fat
insmod search
insmod loadenv
insmod efinet
insmod net
insmod http
net_dhcp
set root=(http,192.168.1.2)

# Persist only coarse stage markers to a separate environment block on the
# installed Fedora ESP. This avoids writing Fedora's own grubenv and avoids
# flooding the client console with GRUB's full debug stream.
search --file --set=alma_esp /EFI/fedora/grub.cfg
function alma_log {
    if [ -n "${alma_esp}" ]; then
        save_env --file ($alma_esp)/EFI/fedora/alma-live-grubenv alma_stage
    fi
}
set alma_stage=grub-start
alma_log

menuentry 'Alma Live - initrd diagnostic' {
    set alma_stage=kernel-command-start
    alma_log
    echo Loading AlmaLinux kernel...
    linux /almalinux-live/vmlinuz root=live:http://192.168.1.2/almalinux-live/squashfs.img rd.live.image rd.neednet=1 ip=dhcp rd.debug nomodeset
    set alma_stage=kernel-command-complete
    alma_log
    echo 'Kernel command completed; loading initramfs...'
    echo The next Caddy request should be initrd.img.
    set alma_stage=initrd-command-start
    alma_log
    set root=(http,192.168.1.2)
    if initrd /almalinux-live/initrd.img; then
        set alma_stage=initrd-command-complete
        alma_log
    else
        set alma_stage=initrd-command-failed
        alma_log
        echo 'INITRD LOAD FAILED; returning to the GRUB menu in 30 seconds.'
        sleep 30
        normal
    fi
    echo Kernel and initramfs commands completed.
    echo 'Booting AlmaLinux Live in 5 seconds...'
    sleep 1
    echo 'Booting AlmaLinux Live in 4 seconds...'
    sleep 1
    echo 'Booting AlmaLinux Live in 3 seconds...'
    sleep 1
    echo 'Booting AlmaLinux Live in 2 seconds...'
    sleep 1
    echo 'Booting AlmaLinux Live in 1 second...'
    sleep 1
    boot
}

menuentry 'GRUB command prompt (manual diagnostics)' {
    echo 'Press c at the menu to enter the GRUB prompt.'
    echo 'Use: help linux; help linuxefi; help initrd; help initrdefi'
    echo 'Then test: ls; ls (http,192.168.1.2)/almalinux-live/'
    read _almalinux_key
    normal
}
